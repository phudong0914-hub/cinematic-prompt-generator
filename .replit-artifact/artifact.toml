kind = "web"
previewPath = "/"
title = "Cinematic Prompt Generator"
version = "1.0.0"
id = "artifacts/cinematique"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20220

[services.development]
run = "pnpm --filter @workspace/cinematique run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinematique", "run", "build" ]
serve = "static"
publicDir = "artifacts/cinematique/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20220"
BASE_PATH = "/"

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Archify — Cine Prompt Pro v2.0 System Architecture</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;--bg2:#0c0e16;--bg3:#12141e;
  --gold:#ffd700;--gold2:#c9a227;--gold3:#a8891a;
  --cyan:#38bdf8;--rose:#ec4899;--purple:#a855f7;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
  --border:rgba(255,215,0,0.15);
  --glow:0 0 20px rgba(255,215,0,0.15);
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}

/* ─── TOOLBAR ─── */
.toolbar{
  position:fixed;top:0;left:0;right:0;z-index:100;height:52px;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(180deg,rgba(12,14,22,0.98),rgba(7,8,13,0.95));
  border-bottom:1px solid var(--border);backdrop-filter:blur(20px);
}
.toolbar .brand{display:flex;align-items:center;gap:8px}
.toolbar .brand-icon{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);background:linear-gradient(135deg,#1a1510,#0f111a);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 10px rgba(255,215,0,0.3)}
.toolbar .brand-text{font-size:0.82rem;font-weight:800;letter-spacing:0.04em}
.toolbar .brand-text span:first-child{color:var(--gold)}
.toolbar .brand-text span:nth-child(2){color:var(--text)}
.toolbar .brand-text span:last-child{color:var(--gold2);font-size:0.65rem;opacity:0.7;margin-left:4px}
.toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.toolbar .view-tabs{display:flex;gap:2px;background:rgba(0,0,0,0.4);border-radius:8px;padding:2px;border:1px solid rgba(255,255,255,0.06)}
.toolbar .vtab{padding:5px 12px;border-radius:6px;border:none;background:transparent;color:var(--text3);font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.toolbar .vtab.active{background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(201,162,39,0.15));color:var(--gold);box-shadow:0 0 8px rgba(255,215,0,0.15)}
.toolbar .vtab:hover:not(.active){color:var(--text2);background:rgba(255,255,255,0.04)}
.search-box{margin-left:auto;position:relative}
.search-box input{width:200px;padding:6px 10px 6px 30px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:var(--text);font-size:0.75rem;font-family:var(--font);outline:none;transition:all 0.2s}
.search-box input:focus{border-color:var(--gold2);box-shadow:0 0 10px rgba(255,215,0,0.1);width:260px}
.search-box::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:0.7rem;opacity:0.5}
.toolbar .tbtn{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--text2);font-size:0.7rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px}
.toolbar .tbtn:hover{background:rgba(255,215,0,0.1);border-color:var(--gold2);color:var(--gold)}

/* ─── CANVAS ─── */
.canvas-container{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.canvas-container.dragging{cursor:grabbing}
.canvas{transform-origin:0 0;will-change:transform}

/* ─── NODE STYLES ─── */
.arch-node{
  position:absolute;border-radius:14px;padding:14px 16px;cursor:pointer;transition:box-shadow 0.25s,transform 0.15s;
  border:1.2px solid rgba(255,255,255,0.08);user-select:none;min-width:160px;
}
.arch-node:hover{transform:scale(1.03);z-index:50}
.arch-node .node-icon{font-size:1.3rem;margin-bottom:4px}
.arch-node .node-title{font-size:0.78rem;font-weight:800;letter-spacing:0.02em;margin-bottom:3px}
.arch-node .node-subtitle{font-size:0.63rem;color:var(--text3);font-weight:500;line-height:1.3}
.arch-node .node-badge{position:absolute;top:-6px;right:-6px;padding:2px 6px;border-radius:8px;font-size:0.55rem;font-weight:800;letter-spacing:0.04em}
.arch-node .node-files{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.arch-node .node-file{padding:1px 5px;border-radius:4px;font-size:0.58rem;font-family:var(--mono);font-weight:500;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);color:var(--text3)}

/* Tier colors */
.tier-presentation{background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(201,162,39,0.04));border-color:rgba(255,215,0,0.25)}
.tier-presentation:hover{box-shadow:0 0 30px rgba(255,215,0,0.15)}
.tier-presentation .node-title{color:var(--gold)}
.tier-presentation .node-badge{background:rgba(255,215,0,0.2);color:var(--gold);border:1px solid rgba(255,215,0,0.3)}

.tier-engine{background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(59,130,246,0.04));border-color:rgba(56,189,248,0.25)}
.tier-engine:hover{box-shadow:0 0 30px rgba(56,189,248,0.15)}
.tier-engine .node-title{color:var(--cyan)}
.tier-engine .node-badge{background:rgba(56,189,248,0.2);color:var(--cyan);border:1px solid rgba(56,189,248,0.3)}

.tier-persist{background:linear-gradient(135deg,rgba(168,85,247,0.08),rgba(139,92,246,0.04));border-color:rgba(168,85,247,0.25)}
.tier-persist:hover{box-shadow:0 0 30px rgba(168,85,247,0.15)}
.tier-persist .node-title{color:var(--purple)}
.tier-persist .node-badge{background:rgba(168,85,247,0.2);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}

.tier-inference{background:linear-gradient(135deg,rgba(236,72,153,0.08),rgba(244,63,94,0.04));border-color:rgba(236,72,153,0.25)}
.tier-inference:hover{box-shadow:0 0 30px rgba(236,72,153,0.15)}
.tier-inference .node-title{color:var(--rose)}
.tier-inference .node-badge{background:rgba(236,72,153,0.2);color:var(--rose);border:1px solid rgba(236,72,153,0.3)}

.tier-export{background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(22,163,74,0.04));border-color:rgba(34,197,94,0.25)}
.tier-export:hover{box-shadow:0 0 30px rgba(34,197,94,0.15)}
.tier-export .node-title{color:var(--green)}
.tier-export .node-badge{background:rgba(34,197,94,0.2);color:var(--green);border:1px solid rgba(34,197,94,0.3)}

/* ─── BOUNDARY ZONES ─── */
.boundary{position:absolute;border-radius:18px;border:1.5px dashed;padding:12px;pointer-events:none}
.boundary .boundary-label{position:absolute;top:-11px;left:20px;padding:2px 10px;border-radius:6px;font-size:0.62rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.bnd-gold{border-color:rgba(255,215,0,0.2)}.bnd-gold .boundary-label{background:rgba(255,215,0,0.15);color:var(--gold);border:1px solid rgba(255,215,0,0.2)}
.bnd-cyan{border-color:rgba(56,189,248,0.2)}.bnd-cyan .boundary-label{background:rgba(56,189,248,0.15);color:var(--cyan);border:1px solid rgba(56,189,248,0.2)}
.bnd-purple{border-color:rgba(168,85,247,0.2)}.bnd-purple .boundary-label{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.2)}
.bnd-rose{border-color:rgba(236,72,153,0.2)}.bnd-rose .boundary-label{background:rgba(236,72,153,0.15);color:var(--rose);border:1px solid rgba(236,72,153,0.2)}
.bnd-green{border-color:rgba(34,197,94,0.2)}.bnd-green .boundary-label{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.2)}

/* ─── SVG CONNECTIONS ─── */
.connections-layer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.conn-line{stroke-width:1.5;fill:none;opacity:0.4;transition:opacity 0.3s}
.conn-line.highlight{opacity:0.9;stroke-width:2.5}

/* ─── PARTICLES ─── */
.particle{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:60;animation:particlePulse 1.5s infinite}
@keyframes particlePulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}

/* ─── DETAIL PANEL ─── */
.detail-panel{
  position:fixed;right:0;top:52px;bottom:0;width:340px;z-index:90;
  background:linear-gradient(180deg,rgba(12,14,22,0.98),rgba(7,8,13,0.96));
  border-left:1px solid var(--border);backdrop-filter:blur(20px);
  transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto;padding:20px;
}
.detail-panel.open{transform:translateX(0)}
.detail-panel .dp-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.8rem;transition:all 0.2s}
.detail-panel .dp-close:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.detail-panel .dp-icon{font-size:2rem;margin-bottom:8px}
.detail-panel .dp-title{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.detail-panel .dp-tier{font-size:0.65rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:12px}
.detail-panel .dp-desc{font-size:0.78rem;color:var(--text2);line-height:1.55;margin-bottom:16px}
.detail-panel .dp-section{margin-bottom:14px}
.detail-panel .dp-section-title{font-size:0.68rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.detail-panel .dp-file-list{display:flex;flex-direction:column;gap:3px}
.detail-panel .dp-file{padding:5px 8px;border-radius:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);font-family:var(--mono);font-size:0.68rem;color:var(--text2);display:flex;align-items:center;gap:6px}
.detail-panel .dp-file .ficon{opacity:0.5}
.detail-panel .dp-dep{padding:4px 8px;border-radius:6px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.15);font-size:0.65rem;color:var(--cyan);cursor:pointer;transition:all 0.15s}
.detail-panel .dp-dep:hover{background:rgba(56,189,248,0.15)}
.detail-panel .dp-exports{display:flex;flex-wrap:wrap;gap:3px}
.detail-panel .dp-export{padding:2px 6px;border-radius:4px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.15);font-family:var(--mono);font-size:0.6rem;color:var(--green)}

/* ─── MINIMAP ─── */
.minimap{
  position:fixed;bottom:16px;right:16px;width:180px;height:120px;z-index:80;
  background:rgba(12,14,22,0.9);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;backdrop-filter:blur(10px);
}
.minimap canvas{width:100%;height:100%}
.minimap .mm-viewport{position:absolute;border:1.5px solid var(--gold);border-radius:2px;pointer-events:none;opacity:0.6}

/* ─── STATS BAR ─── */
.stats-bar{
  position:fixed;bottom:16px;left:16px;z-index:80;display:flex;gap:8px;
}
.stat-chip{padding:5px 10px;border-radius:8px;background:rgba(12,14,22,0.9);border:1px solid var(--border);backdrop-filter:blur(10px);font-size:0.65rem;font-weight:600;color:var(--text3);display:flex;align-items:center;gap:5px}
.stat-chip .sc-val{color:var(--gold);font-weight:800}
.stat-chip .sc-dot{width:6px;height:6px;border-radius:50%}

/* ─── ZOOM CONTROLS ─── */
.zoom-controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:4px;background:rgba(12,14,22,0.9);border:1px solid var(--border);border-radius:10px;padding:4px;backdrop-filter:blur(10px)}
.zoom-controls button{width:32px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text3);font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.zoom-controls button:hover{background:rgba(255,215,0,0.1);color:var(--gold)}
.zoom-controls .zoom-level{padding:0 8px;font-size:0.65rem;color:var(--text3);display:flex;align-items:center;font-weight:600}

/* highlighted node */
.arch-node.highlighted{animation:nodeHighlight 1.5s ease-in-out 3}
@keyframes nodeHighlight{0%,100%{box-shadow:none}50%{box-shadow:0 0 30px rgba(255,215,0,0.4)}}
.arch-node.dimmed{opacity:0.2;transition:opacity 0.3s}

/* Light theme */
.theme-light{--bg:#f8f9fa;--bg2:#ffffff;--bg3:#f1f3f5;--text:#1a1a2e;--text2:#495057;--text3:#868e96;--border:rgba(0,0,0,0.1)}
</style>
</head>
<body>

<!-- ─── TOOLBAR ─── -->
<header class="toolbar">
  <div class="brand">
    <div class="brand-icon">🎬</div>
    <div class="brand-text">

<!-- ─── CANVAS ─── -->
<div class="canvas-container" id="canvas-container">
  <div class="canvas" id="canvas">
    <svg class="connections-layer" id="connections-svg"></svg>
  </div>
</div>

<!-- ─── DETAIL PANEL ─── -->
<div class="detail-panel" id="detail-panel">
  <button class="dp-close" id="dp-close">✕</button>
  <div id="dp-content"></div>
</div>

<!-- ─── ZOOM CONTROLS ─── -->
<div class="zoom-controls">
  <button id="zoom-out" title="Zoom Out">−</button>
  <div class="zoom-level" id="zoom-level">100%</div>
  <button id="zoom-in" title="Zoom In">+</button>

</div>

<!-- ─── STATS BAR ─── -->
<div class="stats-bar">

</div>

<!-- ─── MINIMAP ─── -->
<div class="minimap" id="minimap"><canvas id="minimap-canvas"></canvas><div class="mm-viewport" id="mm-viewport"></div></div>

<script>

const canvas = document.getElementById('canvas');
const container = document.getElementById('canvas-container');
const svg = document.getElementById('connections-svg');
const detailPanel = document.getElementById('detail-panel');
const dpContent = document.getElementById('dp-content');
const searchInput = document.getElementById('search-input');

let scale = 0.85, panX = 60, panY = 10;
let isDragging = false, dragStartX = 0, dragStartY = 0;
let particlesEnabled = true;
let selectedNodeId = null;
const nodeElements = {};

// Draw boundaries
function renderBoundaries() {
  const tierColors = {gold:'bnd-gold',cyan:'bnd-cyan',purple:'bnd-purple',rose:'bnd-rose',green:'bnd-green'};
  SYSTEM_IR.tiers.forEach(tier => {
    const nodesInTier = SYSTEM_IR.nodes.filter(n => n.tier === tier.id);
    if (!nodesInTier.length) return;
    const minX = Math.min(...nodesInTier.map(n => n.x)) - 20;
    const maxX = Math.max(...nodesInTier.map(n => n.x + (n.w||180))) + 20;
    const minY = Math.min(...nodesInTier.map(n => n.y)) - 28;
    const maxY = Math.max(...nodesInTier.map(n => n.y + 120)) + 16;
    const div = document.createElement('div');
    div.className = `boundary ${tierColors[tier.color]}`;
    div.style.cssText = `left:${minX}px;top:${minY}px;width:${maxX-minX}px;height:${maxY-minY}px`;
    div.innerHTML = `<div class="boundary-label">${tier.name}</div>`;
    canvas.appendChild(div);
  });
}

// Draw nodes
function renderNodes() {
  const tierClass = {T1:'tier-presentation',T2:'tier-engine',T3:'tier-persist',T4:'tier-inference',T5:'tier-export'};
  const tierLabel = {T1:'PRESENTATION',T2:'ENGINE',T3:'PERSISTENCE',T4:'INFERENCE',T5:'EXPORT'};
  SYSTEM_IR.nodes.forEach(node => {
    const div = document.createElement('div');
    div.className = `arch-node ${tierClass[node.tier]}`;
    div.dataset.id = node.id;
    div.style.cssText = `left:${node.x}px;top:${node.y}px;width:${node.w||180}px`;
    const filesHtml = (node.files||[]).map(f => `<span class="node-file">${f.split('/').pop()}</span>`).join('');
    div.innerHTML = `
      <div class="node-badge">${tierLabel[node.tier]}</div>
      <div class="node-icon">${node.icon}</div>
      <div class="node-title">${node.title}</div>
      <div class="node-subtitle">${node.subtitle}</div>
      <div class="node-files">${filesHtml}</div>
    `;
    div.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node.id); });
    canvas.appendChild(div);
    nodeElements[node.id] = div;
  });
}

// Draw connections
function renderConnections() {
  svg.innerHTML = '';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  // Arrow markers
  ['gold','cyan','purple','rose','green'].forEach(c => {
    const colors = {gold:'#ffd700',cyan:'#38bdf8',purple:'#a855f7',rose:'#ec4899',green:'#22c55e'};
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id',`arrow-${c}`);
    marker.setAttribute('markerWidth','8');
    marker.setAttribute('markerHeight','6');
    marker.setAttribute('refX','8');
    marker.setAttribute('refY','3');
    marker.setAttribute('orient','auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points','0 0, 8 3, 0 6');
    poly.setAttribute('fill', colors[c]);
    poly.setAttribute('opacity','0.6');
    marker.appendChild(poly);
    defs.appendChild(marker);
  });
  svg.appendChild(defs);

  const tierColorMap = {};
  SYSTEM_IR.tiers.forEach(t => { const nodesInTier = SYSTEM_IR.nodes.filter(n=>n.tier===t.id); nodesInTier.forEach(n => tierColorMap[n.id] = t.color); });

  SYSTEM_IR.connections.forEach(conn => {
    const fromNode = SYSTEM_IR.nodes.find(n => n.id === conn.from);
    const toNode = SYSTEM_IR.nodes.find(n => n.id === conn.to);
    if (!fromNode || !toNode) return;

    const fx = fromNode.x + (fromNode.w||180)/2;
    const fy = fromNode.y + 55;
    const tx = toNode.x + (toNode.w||180)/2;
    const ty = toNode.y + 55;

    const color = tierColorMap[conn.from] || 'gold';
    const colors = {gold:'#ffd700',cyan:'#38bdf8',purple:'#a855f7',rose:'#ec4899',green:'#22c55e'};

    // Curved path
    const dx = tx - fx, dy = ty - fy;
    const cx1 = fx + dx*0.2, cy1 = fy + dy*0.5;
    const cx2 = tx - dx*0.2, cy2 = ty - dy*0.5;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${fx},${fy} C${cx1},${cy1} ${cx2},${cy2} ${tx},${ty}`);
    path.setAttribute('stroke', colors[color]);
    path.setAttribute('marker-end', `url(#arrow-${color})`);
    path.className.baseVal = 'conn-line';
    path.dataset.from = conn.from;
    path.dataset.to = conn.to;
    svg.appendChild(path);
  });

  // Resize SVG
  const allNodes = SYSTEM_IR.nodes;
  const maxX = Math.max(...allNodes.map(n => n.x + (n.w||180))) + 100;
  const maxY = Math.max(...allNodes.map(n => n.y)) + 250;
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
  svg.style.width = maxX + 'px';
  svg.style.height = maxY + 'px';

  document.getElementById('conn-count').textContent = SYSTEM_IR.connections.length;
}

// Select node
function selectNode(nodeId) {
  selectedNodeId = nodeId;
  const node = SYSTEM_IR.nodes.find(n => n.id === nodeId);
  if (!node) return;

  // Highlight
  Object.values(nodeElements).forEach(el => el.classList.remove('highlighted','dimmed'));
  nodeElements[nodeId]?.classList.add('highlighted');

  // Highlight connected
  const connectedIds = new Set([nodeId]);
  SYSTEM_IR.connections.forEach(c => {
    if (c.from === nodeId) connectedIds.add(c.to);
    if (c.to === nodeId) connectedIds.add(c.from);
  });
  Object.entries(nodeElements).forEach(([id, el]) => {
    if (!connectedIds.has(id)) el.classList.add('dimmed');
  });

  // Highlight lines
  svg.querySelectorAll('.conn-line').forEach(line => {
    if (line.dataset.from === nodeId || line.dataset.to === nodeId) {
      line.classList.add('highlight');
    } else {
      line.classList.remove('highlight');
      line.style.opacity = '0.08';
    }
  });

  // Deps
  const inbound = SYSTEM_IR.connections.filter(c => c.to === nodeId).map(c => ({id:c.from, label:c.label, node: SYSTEM_IR.nodes.find(n=>n.id===c.from)}));
  const outbound = SYSTEM_IR.connections.filter(c => c.from === nodeId).map(c => ({id:c.to, label:c.label, node: SYSTEM_IR.nodes.find(n=>n.id===c.to)}));
  const tier = SYSTEM_IR.tiers.find(t => t.id === node.tier);
  const tierColors = {gold:'var(--gold)',cyan:'var(--cyan)',purple:'var(--purple)',rose:'var(--rose)',green:'var(--green)'};

  dpContent.innerHTML = `
    <div class="dp-icon">${node.icon}</div>
    <div class="dp-title" style="color:${tierColors[tier.color]}">${node.title}</div>
    <div class="dp-tier" style="background:${tierColors[tier.color]}22;color:${tierColors[tier.color]};border:1px solid ${tierColors[tier.color]}44">${tier.name}</div>
    <div class="dp-desc">${node.desc}</div>
    <div class="dp-section">
      <div class="dp-section-title">📁 Source Files</div>
      <div class="dp-file-list">
        ${(node.files||[]).map(f => `<div class="dp-file"><span class="ficon">📄</span>${f}</div>`).join('')}
      </div>
    </div>
    <div class="dp-section">
      <div class="dp-section-title">📤 Exports (${(node.exports||[]).length})</div>
      <div class="dp-exports">
        ${(node.exports||[]).map(e => `<div class="dp-export">${e}</div>`).join('')}
      </div>
    </div>
    ${inbound.length ? `
    <div class="dp-section">
      <div class="dp-section-title">⬅️ Inbound Dependencies (${inbound.length})</div>
      <div class="dp-file-list">
        ${inbound.map(d => `<div class="dp-dep" onclick="selectNode('${d.id}')">${d.node?.icon||'📦'} ${d.node?.title||d.id} → ${d.label}</div>`).join('')}
      </div>
    </div>` : ''}
    ${outbound.length ? `
    <div class="dp-section">
      <div class="dp-section-title">➡️ Outbound Dependencies (${outbound.length})</div>
      <div class="dp-file-list">
        ${outbound.map(d => `<div class="dp-dep" onclick="selectNode('${d.id}')">${d.node?.icon||'📦'} ${d.node?.title||d.id} → ${d.label}</div>`).join('')}
      </div>
    </div>` : ''}
  `;
  detailPanel.classList.add('open');
}

function deselectNode() {
  selectedNodeId = null;
  Object.values(nodeElements).forEach(el => el.classList.remove('highlighted','dimmed'));
  svg.querySelectorAll('.conn-line').forEach(line => { line.classList.remove('highlight'); line.style.opacity = ''; });
  detailPanel.classList.remove('open');
}

// ─── PAN & ZOOM ───
function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
  updateMinimap();
}

container.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.arch-node')) return;
  isDragging = true; dragStartX = e.clientX - panX; dragStartY = e.clientY - panY;
  container.classList.add('dragging');
  container.setPointerCapture(e.pointerId);
});
container.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
  applyTransform();
});
container.addEventListener('pointerup', () => { isDragging = false; container.classList.remove('dragging'); });
container.addEventListener('click', (e) => { if (!e.target.closest('.arch-node')) deselectNode(); });

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.min(2.5, Math.max(0.2, scale * delta));
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, {passive:false});

document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(2.5, scale * 1.2); applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.2, scale * 0.8); applyTransform(); });
document.getElementById('zoom-fit').addEventListener('click', () => {
  const allNodes = SYSTEM_IR.nodes;
  const maxX = Math.max(...allNodes.map(n => n.x + (n.w||180))) + 60;
  const maxY = Math.max(...allNodes.map(n => n.y)) + 200;
  const rect = container.getBoundingClientRect();
  scale = Math.min(rect.width / maxX, (rect.height) / maxY) * 0.9;
  panX = (rect.width - maxX * scale) / 2;
  panY = (rect.height - maxY * scale) / 2 + 20;
  applyTransform();
});

// ─── SEARCH ───
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    Object.values(nodeElements).forEach(el => el.classList.remove('dimmed','highlighted'));
    return;
  }
  Object.entries(nodeElements).forEach(([id, el]) => {
    const node = SYSTEM_IR.nodes.find(n => n.id === id);
    const match = node && (
      node.title.toLowerCase().includes(q) ||
      node.subtitle.toLowerCase().includes(q) ||
      (node.files||[]).some(f => f.toLowerCase().includes(q)) ||
      (node.exports||[]).some(e => e.toLowerCase().includes(q))
    );
    el.classList.toggle('dimmed', !match);
    el.classList.toggle('highlighted', !!match);
  });
});

// ─── PARTICLES ───
let particleInterval;
function spawnParticles() {
  if (!particlesEnabled) return;
  const colors = {gold:'#ffd700',cyan:'#38bdf8',purple:'#a855f7',rose:'#ec4899',green:'#22c55e'};
  const tierColorMap = {};
  SYSTEM_IR.tiers.forEach(t => SYSTEM_IR.nodes.filter(n=>n.tier===t.id).forEach(n => tierColorMap[n.id] = t.color));

  // Pick random connection
  const conn = SYSTEM_IR.connections[Math.floor(Math.random() * SYSTEM_IR.connections.length)];
  const fromNode = SYSTEM_IR.nodes.find(n => n.id === conn.from);
  const toNode = SYSTEM_IR.nodes.find(n => n.id === conn.to);
  if (!fromNode || !toNode) return;

  const particle = document.createElement('div');
  particle.className = 'particle';
  const color = colors[tierColorMap[conn.from]] || '#ffd700';
  particle.style.background = color;
  particle.style.boxShadow = `0 0 6px ${color}`;
  canvas.appendChild(particle);

  const fx = fromNode.x + (fromNode.w||180)/2;
  const fy = fromNode.y + 55;
  const tx = toNode.x + (toNode.w||180)/2;
  const ty = toNode.y + 55;

  const duration = 1500 + Math.random() * 1000;
  const start = performance.now();

  function animate(now) {
    const t = Math.min(1, (now - start) / duration);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    particle.style.left = (fx + (tx - fx) * ease) + 'px';
    particle.style.top = (fy + (ty - fy) * ease) + 'px';
    if (t < 1) requestAnimationFrame(animate);
    else particle.remove();
  }
  requestAnimationFrame(animate);
}

function startParticles() { particleInterval = setInterval(spawnParticles, 200); }
function stopParticles() { clearInterval(particleInterval); canvas.querySelectorAll('.particle').forEach(p => p.remove()); }

document.getElementById('btn-toggle-particles').addEventListener('click', function() {
  particlesEnabled = !particlesEnabled;
  if (particlesEnabled) { startParticles(); this.textContent = '✨ Particles'; }
  else { stopParticles(); this.textContent = '💤 Particles'; }
});

// ─── MINIMAP ───
function updateMinimap() {
  const mmCanvas = document.getElementById('minimap-canvas');
  const ctx = mmCanvas.getContext('2d');
  const mmW = 180, mmH = 120;
  mmCanvas.width = mmW * 2; mmCanvas.height = mmH * 2;
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, mmW, mmH);

  const allNodes = SYSTEM_IR.nodes;
  const maxX = Math.max(...allNodes.map(n => n.x + (n.w||180))) + 60;
  const maxY = Math.max(...allNodes.map(n => n.y)) + 200;
  const scaleX = mmW / maxX, scaleY = mmH / maxY;
  const s = Math.min(scaleX, scaleY);

  const tierColors = {T1:'#ffd700',T2:'#38bdf8',T3:'#a855f7',T4:'#ec4899',T5:'#22c55e'};
  allNodes.forEach(node => {
    ctx.fillStyle = tierColors[node.tier] || '#ffd700';
    ctx.globalAlpha = 0.6;
    ctx.fillRect(node.x * s, node.y * s, (node.w||180) * s, 40 * s);
  });
  ctx.globalAlpha = 1;

  // Viewport indicator
  const rect = container.getBoundingClientRect();
  const vp = document.getElementById('mm-viewport');
  const vpW = rect.width / scale * s;
  const vpH = rect.height / scale * s;
  const vpX = -panX / scale * s;
  const vpY = (-panY + 52) / scale * s;
  vp.style.cssText = `left:${vpX}px;top:${vpY}px;width:${vpW}px;height:${vpH}px`;
}

// ─── EXPORT PNG ───
document.getElementById('btn-export-png').addEventListener('click', () => {
  const allNodes = SYSTEM_IR.nodes;
  const maxX = Math.max(...allNodes.map(n => n.x + (n.w||180))) + 100;
  const maxY = Math.max(...allNodes.map(n => n.y)) + 250;
  
  const offscreen = document.createElement('canvas');
  offscreen.width = maxX * 2; offscreen.height = maxY * 2;
  const ctx = offscreen.getContext('2d');
  ctx.scale(2, 2);
  ctx.fillStyle = '#07080d';
  ctx.fillRect(0, 0, maxX, maxY);

  // Draw boundaries
  const tierColors2 = {T1:'rgba(255,215,0,0.15)',T2:'rgba(56,189,248,0.15)',T3:'rgba(168,85,247,0.15)',T4:'rgba(236,72,153,0.15)',T5:'rgba(34,197,94,0.15)'};
  const tierTextColors = {T1:'#ffd700',T2:'#38bdf8',T3:'#a855f7',T4:'#ec4899',T5:'#22c55e'};

  SYSTEM_IR.tiers.forEach(tier => {
    const nodesInTier = allNodes.filter(n => n.tier === tier.id);
    if (!nodesInTier.length) return;
    const minX = Math.min(...nodesInTier.map(n => n.x)) - 20;
    const mX = Math.max(...nodesInTier.map(n => n.x + (n.w||180))) + 20;
    const minY = Math.min(...nodesInTier.map(n => n.y)) - 28;
    const mY = Math.max(...nodesInTier.map(n => n.y + 120)) + 16;
    ctx.strokeStyle = tierTextColors[tier.id];
    ctx.globalAlpha = 0.3;
    ctx.setLineDash([6,4]);
    ctx.strokeRect(minX, minY, mX-minX, mY-minY);
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = tierTextColors[tier.id];
    ctx.font = '600 10px Inter, sans-serif';
    ctx.fillText(tier.name.toUpperCase(), minX + 10, minY - 4);
  });

  // Draw nodes
  allNodes.forEach(node => {
    const tc = tierTextColors[node.tier];
    ctx.fillStyle = 'rgba(18,20,30,0.9)';
    ctx.strokeStyle = tc;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1.2;
    const r = 10;
    const x = node.x, y = node.y, w = node.w||180, h = 90;
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = tc;
    ctx.font = '800 11px Inter, sans-serif';
    ctx.fillText(node.icon + ' ' + node.title, x+10, y+24);
    ctx.fillStyle = '#a1a1aa';
    ctx.font = '500 9px Inter, sans-serif';
    ctx.fillText(node.subtitle, x+10, y+40);
  });

  const a = document.createElement('a');
  a.href = offscreen.toDataURL('image/png');
  a.download = 'cineprompt-architecture.png';
  a.click();
});
